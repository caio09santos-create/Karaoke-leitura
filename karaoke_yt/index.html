<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    #barra { display: flex; align-items: center; gap: 10px; padding: 6px 4px; flex-wrap: wrap; }
    #prep {
      font-size: 15px; font-weight: 600; padding: 8px 16px; cursor: pointer;
      border: none; border-radius: 8px; background: #1e9e4a; color: #fff;
    }
    #prep:disabled { opacity: .5; cursor: default; }
    #status { font-size: 13px; color: #555; }
    #erro { color: #d63333; font-size: 13px; padding: 4px; }
    #player { width: 100%; }
    #player iframe { width: 100%; height: 315px; border: 0; }
  </style>
</head>
<body>
  <div id="barra">
    <button id="prep" type="button">🎤 Preparar microfone</button>
    <span id="status">prepare o microfone e dê play no vídeo</span>
  </div>
  <div id="erro"></div>
  <div id="player"></div>

  <script>
    // ---- Protocolo v1 de componente do Streamlit (implementado à mão) ----
    function post(msg) {
      msg.isStreamlitMessage = true;
      window.parent.postMessage(msg, "*");
    }
    const Streamlit = {
      ready() { post({ type: "streamlit:componentReady", apiVersion: 1 }); },
      setHeight(h) { post({ type: "streamlit:setFrameHeight", height: h }); },
      setValue(v) { post({ type: "streamlit:setComponentValue", dataType: "json", value: v }); },
    };

    let VIDEO_ID = null;
    let apiReady = false;
    let player = null;
    let montado = false;
    let stream = null;
    let mediaRecorder = null;
    let chunks = [];
    let gravando = false;
    let t0 = 0;

    const elPrep = document.getElementById("prep");
    const elStatus = document.getElementById("status");
    const elErro = document.getElementById("erro");

    function criarPlayer() {
      if (!apiReady || !VIDEO_ID || player) return;
      player = new YT.Player("player", {
        videoId: VIDEO_ID,
        playerVars: { rel: 0, modestbranding: 1 },
        events: { onStateChange: onState },
      });
    }
    window.onYouTubeIframeAPIReady = function () { apiReady = true; criarPlayer(); };

    elPrep.addEventListener("click", async () => {
      elErro.textContent = "";
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        elPrep.disabled = true;
        elStatus.textContent = "🎤 microfone pronto — dê play no vídeo para gravar";
      } catch (e) {
        elErro.textContent = "Não foi possível acessar o microfone. Permita o acesso e tente de novo.";
      }
    });

    function onState(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        if (stream && !gravando) iniciarGravacao();
        else if (!stream) elErro.textContent = "Clique em 🎤 Preparar microfone antes de tocar.";
      } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
        if (gravando) pararGravacao();
      }
    }

    function iniciarGravacao() {
      chunks = [];
      try {
        mediaRecorder = new MediaRecorder(stream);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
      }
      mediaRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mediaRecorder.onstop = enviarGravacao;
      mediaRecorder.start();
      t0 = performance.now();
      gravando = true;
      elStatus.textContent = "🔴 gravando… pause ou termine o vídeo para calcular a nota";
    }

    function pararGravacao() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      gravando = false;
      elStatus.textContent = "processando…";
    }

    function enviarGravacao() {
      const mime = (mediaRecorder && mediaRecorder.mimeType) || "audio/webm";
      const blob = new Blob(chunks, { type: mime });
      const dur = (performance.now() - t0) / 1000;
      const reader = new FileReader();
      reader.onloadend = () => {
        const b64 = String(reader.result).split(",")[1] || "";
        Streamlit.setValue({ audio_b64: b64, mime: blob.type, duracao_s: dur });
        elStatus.textContent = "✅ gravação enviada — veja a nota abaixo";
      };
      reader.readAsDataURL(blob);
    }

    function onRender(args) {
      if (montado) return;
      montado = true;
      VIDEO_ID = (args && args.video_id) || null;
      if (!VIDEO_ID) {
        elErro.textContent = "Link do YouTube inválido.";
        return;
      }
      Streamlit.setHeight(420);
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
      criarPlayer();  // caso a API já esteja carregada
    }

    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "streamlit:render") onRender(e.data.args || {});
    });
    Streamlit.ready();
  </script>
</body>
</html>
