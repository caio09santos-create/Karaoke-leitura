<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    /* vídeo ocupa toda a largura; a altura segue a proporção 16:9 */
    #tela { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
    #tela iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* camada "calculando" por cima do vídeo (só na tela de usuário) */
    #calc {
      position: absolute; inset: 0; z-index: 2; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      background: rgba(10, 10, 20, 0.82); color: #fff; text-align: center;
    }
    #calc.on { display: flex; }
    #calc-num {
      font-size: min(32vw, 220px); font-weight: 800; line-height: 1;
      font-variant-numeric: tabular-nums; color: #3ddc84;
      text-shadow: 0 0 24px rgba(61, 220, 132, 0.55);
    }
    #calc-txt { font-size: 22px; margin-top: 14px; opacity: .9; animation: pulsar 1s infinite; }
    @keyframes pulsar { 50% { opacity: .35; } }
    #status { font-size: 13px; color: #555; padding: 8px 2px 2px; }
    #erro { color: #d63333; font-size: 13px; padding: 2px; }
  </style>
</head>
<body>
  <div id="tela">
    <div id="player"></div>
    <div id="calc"><div id="calc-num">00</div><div id="calc-txt">Calculando sua nota...</div></div>
  </div>
  <div id="status">Carregando o vídeo...</div>
  <div id="erro"></div>

  <script>
    // ---- Protocolo v1 de componente do Streamlit (implementado à mão) ----
    function post(msg) {
      msg.isStreamlitMessage = true;
      window.parent.postMessage(msg, "*");
    }
    const Streamlit = {
      ready() { post({ type: "streamlit:componentReady", apiVersion: 1 }); },
      setHeight(h) { post({ type: "streamlit:setFrameHeight", height: h }); },
      setValue(v) { post({ type: "streamlit:setComponentValue", dataType: "json", value: v }); },
    };

    let VIDEO_ID = null;
    let apiReady = false;
    let player = null;
    let montado = false;
    let stream = null;
    let mediaRecorder = null;
    let chunks = [];
    let gravando = false;
    let pedindo = false;
    let sobrepor = false;
    let t0 = 0;

    const elStatus = document.getElementById("status");
    const elErro = document.getElementById("erro");

    // a altura do componente acompanha o conteúdo (o vídeo cresce com a largura)
    function ajustarAltura() { Streamlit.setHeight(document.body.scrollHeight); }
    new ResizeObserver(ajustarAltura).observe(document.body);

    function criarPlayer() {
      if (!apiReady || !VIDEO_ID || player) return;
      player = new YT.Player("player", {
        videoId: VIDEO_ID,
        playerVars: { rel: 0, modestbranding: 1 },
        events: { onStateChange: onState },
      });
    }
    window.onYouTubeIframeAPIReady = function () { apiReady = true; criarPlayer(); };

    async function micLiberado() {
      try {
        const p = await navigator.permissions.query({ name: "microphone" });
        return p.state === "granted";
      } catch (e) {
        return false;
      }
    }

    async function pegarMic() {
      if (stream) return true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        return true;
      } catch (e) {
        elErro.textContent =
          "Não consegui acessar o microfone. Libere no cadeado da barra de endereço.";
        return false;
      }
    }

    async function onState(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        if (gravando || pedindo) return;
        if (!stream) {
          pedindo = true;
          const jaLiberado = await micLiberado();
          // sem permissão ainda: pausa enquanto o navegador pergunta, e retoma depois
          if (!jaLiberado) player.pauseVideo();
          const ok = await pegarMic();
          pedindo = false;
          if (!ok) {
            player.pauseVideo();
            return;
          }
          if (!jaLiberado) {
            player.playVideo();  // o novo PLAYING inicia a gravação
            return;
          }
        }
        iniciarGravacao();
      } else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
        if (gravando) pararGravacao();
      }
    }

    function iniciarGravacao() {
      elErro.textContent = "";
      chunks = [];
      try {
        mediaRecorder = new MediaRecorder(stream);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
      }
      mediaRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      mediaRecorder.onstop = enviarGravacao;
      mediaRecorder.start();
      t0 = performance.now();
      gravando = true;
      elStatus.textContent = "🔴 Gravando. Pause ou deixe o vídeo terminar para ver a nota.";
    }

    function pararGravacao() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      gravando = false;
      elStatus.textContent = "Processando...";
      if (sobrepor) mostrarCalculo();
    }

    function mostrarCalculo() {
      // números trocando rápido enquanto o app calcula a nota
      const elNum = document.getElementById("calc-num");
      document.getElementById("calc").classList.add("on");
      setInterval(() => {
        elNum.textContent = String(Math.floor(Math.random() * 100)).padStart(2, "0");
      }, 70);
    }

    function enviarGravacao() {
      // libera o microfone (apaga o indicador de gravação do navegador)
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = null;
      const mime = (mediaRecorder && mediaRecorder.mimeType) || "audio/webm";
      const blob = new Blob(chunks, { type: mime });
      const dur = (performance.now() - t0) / 1000;
      const reader = new FileReader();
      reader.onloadend = () => {
        const b64 = String(reader.result).split(",")[1] || "";
        Streamlit.setValue({ audio_b64: b64, mime: blob.type, duracao_s: dur });
        elStatus.textContent = "✅ Gravação enviada.";
      };
      reader.readAsDataURL(blob);
    }

    async function onRender(args) {
      if (montado) return;
      montado = true;
      VIDEO_ID = (args && args.video_id) || null;
      sobrepor = Boolean(args && args.sobrepor);
      if (!VIDEO_ID) {
        elErro.textContent = "Link do YouTube inválido.";
        return;
      }
      ajustarAltura();
      elStatus.textContent = (await micLiberado())
        ? "🎤 Dê play no vídeo e cante: a gravação começa junto."
        : "🎤 Dê play no vídeo e cante. Na primeira vez o navegador pede o microfone "
          + "(ou libere antes em Preparação, na barra lateral).";
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
      criarPlayer();  // caso a API já esteja carregada
    }

    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "streamlit:render") onRender(e.data.args || {});
    });
    Streamlit.ready();
  </script>
</body>
</html>
